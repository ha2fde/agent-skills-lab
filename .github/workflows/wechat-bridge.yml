name: WeChat Sites MCP regression
on:
  push:
    paths:
      - 'sites/wechat-draft-bridge/source/**'
      - '.github/workflows/wechat-bridge.yml'
  pull_request:
    paths:
      - 'sites/wechat-draft-bridge/source/**'
      - '.github/workflows/wechat-bridge.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sites/wechat-draft-bridge/source
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: sites/wechat-draft-bridge/source/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: node node_modules/typescript/bin/tsc --noEmit
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:built
